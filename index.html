<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>52 Launch | Link Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <span class="brand-mark">52</span>
        <span class="brand-name">Launch<span class="brand-dot">.</span></span>
      </div>
      <p class="tagline">Link Hub — everything worth a click, in one place.</p>
    </div>
  </header>

  <main class="wrap">
    <section id="links-container" class="grid">
      <!-- Cards are rendered here at runtime by app.js from links-data.js -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Built for 52 Launch · <a href="https://github.com/" target="_blank" rel="noopener">Fork on GitHub</a> · Add links in <code>links-data.js</code></p>
    </div>
  </footer>

  <script src="links-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
